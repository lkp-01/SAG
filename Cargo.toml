[workspace]
resolver = "2"
members = [
    "shared/tunnel-proto",
    "shared/storage",
    "shared/runtime-budget",
    "shared/service-health",
    "services/control-plane-admin",
    "services/sag-auth",
    "services/sag-policy",
    "proxy/agents/stealth-tunnel-agent",
    "proxy/connectors/sag-connector",
    "proxy/http-tunnel-bridge",
    "proxy/public-edge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.7", features = ["macros", "json"] }
bytes = "1.9"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full", "tokio"] }
jsonwebtoken = "9"
moka = { version = "0.12", features = ["future"] }
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-postgres = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls", "tls-roots", "prost"] }
tonic-build = "0.12"
tower = "0.5"
tower-http = { version = "0.5", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
# Unify on `ring` only: reqwest/hyper-rustls also enables ring; mixing with default
# `aws-lc-rs` on tokio-rustls/rustls causes rustls 0.23 to panic (no CryptoProvider).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
