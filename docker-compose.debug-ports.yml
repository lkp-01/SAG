# Local troubleshooting only. Always combine with the matching base Compose.
# Every published internal port is loopback-bound and must never be used as a
# production override.
services:
  http-tunnel-bridge:
    ports:
      - "127.0.0.1:9000:9000"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  etcd:
    ports:
      - "127.0.0.1:2379:2379"

  apisix:
    ports:
      - "127.0.0.1:9080:9080"
      - "127.0.0.1:9180:9180"
