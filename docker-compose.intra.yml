x-service-defaults: &service-defaults
  restart: unless-stopped
  stop_grace_period: 35s
  mem_limit: 1g
  cpus: 2.0

services:
  # Intra host (private network) over VPN+DNS

  # APISIX needs etcd
  etcd:
    <<: *service-defaults
    image: quay.io/coreos/etcd:v3.5.15
    container_name: sag-etcd
    command:
      - etcd
      - --name=sag-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=sag-etcd=http://etcd:2380
    expose:
      - "2379"
      - "2380"
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  apisix:
    <<: *service-defaults
    image: apache/apisix:3.10.0-debian
    container_name: sag-apisix
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      SAG_APISIX_ADMIN_API_KEY: ${SAG_APISIX_ADMIN_API_KEY:-your-admin-key}
    expose:
      - "9080"
      - "9180"
      - "9092"
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    healthcheck:
      test: ["CMD", "apisix", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  mock-workload:
    <<: *service-defaults
    image: python:3.11-slim
    container_name: sag-mock
    working_dir: /workspace/infra/test-workload
    command: ["python", "mock_http_server.py"]
    volumes:
      - ./:/workspace
    ports:
      - "18080:18080"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',18080),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  company-demo-sites:
    <<: *service-defaults
    image: python:3.11-slim
    container_name: sag-company-demo-sites
    working_dir: /app
    command: ["python", "server.py"]
    volumes:
      - ./infra/demo-sites:/app
    ports:
      - "28080:28080"
    environment:
      DEMO_SITES_ADDR: "0.0.0.0"
      DEMO_SITES_PORT: "28080"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',28080),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  metrics-gateway:
    <<: *service-defaults
    image: nginx:1.27-alpine
    container_name: sag-metrics-gateway
    depends_on:
      sag-connector:
        condition: service_healthy
      apisix:
        condition: service_healthy
      mock-workload:
        condition: service_healthy
    ports:
      - "19090:19090"
    volumes:
      - ./infra/observability/nginx.intra.metrics.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:19090/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  sag-connector:
    <<: *service-defaults
    build:
      context: .
      dockerfile: ./infra/docker/rust-toolchain.Dockerfile
    image: sag-rust-toolchain:1.94
    container_name: sag-connector
    working_dir: /workspace
    command: ["cargo", "run", "-p", "sag-connector"]
    env_file:
      - path: ./.env.intra
        required: false
    depends_on:
      apisix:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - target_cache:/workspace/target
    environment:
      SAG_DOCKER_COMPOSE: "1"
      # Tunnel / connector id / gRPC TLS name MUST come from ./.env.intra (env_file).
      # Do NOT set them here with ${VAR:-default}: Compose interpolates from the host shell / project .env
      # only, not from env_file — that silently ignored .env.intra and broke dual-host + heartbeat keys.
      SAG_APP_ID: ${SAG_APP_ID:-app-001}
      SAG_EXTERNAL_HOST: ${SAG_EXTERNAL_HOST:-app.internal.com}
      SAG_APISIX_BASE_URL: ${SAG_APISIX_BASE_URL:-http://apisix:9080}
      SAG_APISIX_READINESS_URL: ${SAG_APISIX_READINESS_URL:-http://apisix:9092/v1/healthcheck}
      SAG_HEALTH_LISTEN_ADDR: ${SAG_CONNECTOR_HEALTH_LISTEN_ADDR:-0.0.0.0:9106}
      SAG_MESH_MODE: ${SAG_MESH_MODE:-noop}
      SAG_METRICS_LISTEN_ADDR: ${SAG_CONNECTOR_METRICS_LISTEN_ADDR:-0.0.0.0:9103}
      SAG_CONNECTOR_HEARTBEAT_INTERVAL_MS: ${SAG_CONNECTOR_HEARTBEAT_INTERVAL_MS:-2000}
      SAG_CONNECTOR_RECONNECT_ENABLED: ${SAG_CONNECTOR_RECONNECT_ENABLED:-true}
      SAG_GRPC_KEEPALIVE_MS: ${SAG_GRPC_KEEPALIVE_MS:-5000}
      SAG_GRPC_KEEPALIVE_TIMEOUT_MS: ${SAG_GRPC_KEEPALIVE_TIMEOUT_MS:-5000}
      SAG_GRPC_TCP_KEEPALIVE_MS: ${SAG_GRPC_TCP_KEEPALIVE_MS:-5000}
      SAG_CONNECTOR_STREAM_BUFFER: ${SAG_CONNECTOR_STREAM_BUFFER:-128}
      SAG_CONNECTOR_MAX_INFLIGHT: ${SAG_CONNECTOR_MAX_INFLIGHT:-256}
      SAG_CONNECTOR_ACCEPT_QUEUE: ${SAG_CONNECTOR_ACCEPT_QUEUE:-256}
      SAG_CONNECTOR_HTTP_TIMEOUT_MS: ${SAG_CONNECTOR_HTTP_TIMEOUT_MS:-55000}
      SAG_CONNECTOR_GRPC_CHANNEL_TIMEOUT_MS: ${SAG_CONNECTOR_GRPC_CHANNEL_TIMEOUT_MS:-120000}
      SAG_CONNECTOR_MAX_REQUEST_BODY_BYTES: ${SAG_CONNECTOR_MAX_REQUEST_BODY_BYTES:-1048576}
      SAG_CONNECTOR_MAX_RESPONSE_BODY_BYTES: ${SAG_CONNECTOR_MAX_RESPONSE_BODY_BYTES:-1048576}
      SAG_MEMORY_BUDGET_BYTES: ${SAG_CONNECTOR_MEMORY_BUDGET_BYTES:-1610612736}
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9106; printf \"GET /ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    expose:
      - "9106"

volumes:
  etcd_data:
  cargo_registry:
  cargo_git:
  target_cache:
