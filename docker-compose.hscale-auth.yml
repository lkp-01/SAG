# Optional Edge horizontal scale: second sag-auth + nginx LB on host :8080.
#
# Usage (from REPO_ROOT; stack with existing bridge hscale + release + perf):
#   docker compose -f docker-compose.edge.yml -f docker-compose.release.edge.yml \
#     -f docker-compose.hscale-edge.yml -f docker-compose.hscale-auth.yml \
#     (sag-auth-2 uses release binary below; pair with release.edge.yml for sag-auth)
#     -f docker-compose.edge.perf.yml -f docker-compose.hscale-edge.perf.yml \
#     -f docker-compose.hscale-auth.perf.yml \
#     --env-file scripts/ops/cpuset-edge-28.env up -d --force-recreate
#
# Notes:
# - Host :8080 is bound by sag-auth-lb (not sag-auth). k6 / browsers still use EdgeIP:8080.
# - sag-auth / sag-auth-2 share SAG_SESSION_REDIS_URL (login memo). SAG_JWT_SECRET must match.
# - Internal callers (agent, admin-next) are repointed to http://sag-auth-lb:8080 in this override.

x-ha-runtime: &ha-runtime
  restart: unless-stopped
  stop_grace_period: 35s
  mem_limit: 1g
  cpus: 2.0

x-auth-security-environment: &auth-security-environment
  SAG_STORAGE_BACKEND: postgres
  SAG_POSTGRES_DSN: ${SAG_POSTGRES_DSN:?PostgreSQL DSN is required}
  SAG_JWT_SECRET: ${SAG_JWT_SECRET:?JWT secret is required}
  SAG_BOOTSTRAP_ADMIN_PASSWORD: ${SAG_BOOTSTRAP_ADMIN_PASSWORD:?bootstrap Admin password is required}
  SAG_SESSION_REDIS_URL: ${SAG_SESSION_REDIS_URL:?authenticated HA Redis session URL is required}
  SAG_AUTH_INVALIDATION_REDIS_URL: ${SAG_AUTH_INVALIDATION_REDIS_URL:-${SAG_SESSION_REDIS_URL:?authenticated HA Redis session URL is required}}
  SAG_AUTH_VERSION_CACHE_TTL_SEC: ${SAG_AUTH_VERSION_CACHE_TTL_SEC:-5}
  SAG_FOURA_CLIENT_SECRET: ${SAG_FOURA_CLIENT_SECRET:?4A client secret is required}

x-policy-security-environment: &policy-security-environment
  SAG_STORAGE_BACKEND: postgres
  SAG_POSTGRES_DSN: ${SAG_POSTGRES_DSN:?PostgreSQL DSN is required}
  SAG_JWT_SECRET: ${SAG_JWT_SECRET:?JWT secret is required}
  SAG_POLICY_INTERNAL_TOKEN: ${SAG_POLICY_INTERNAL_TOKEN:?Policy internal token is required}
  SAG_POLICY_CACHE_REDIS_URL: ${SAG_POLICY_CACHE_REDIS_URL:?authenticated HA Redis policy URL is required}

services:
  sag-auth:
    container_name: !reset null
    ports: !reset []
    expose:
      - "8080"
    environment:
      SAG_AUTH_INSTANCE_ID: edge-auth-1
      SAG_AUTH_INVALIDATION_REDIS_URL: ${SAG_AUTH_INVALIDATION_REDIS_URL:-${SAG_SESSION_REDIS_URL:?authenticated HA Redis session URL is required}}
      SAG_AUTH_VERSION_CACHE_TTL_SEC: ${SAG_AUTH_VERSION_CACHE_TTL_SEC:-5}

  sag-policy:
    container_name: !reset null
    ports: !reset []
    expose:
      - "8081"
    environment:
      SAG_POLICY_INSTANCE_ID: edge-policy-1

  sag-auth-2:
    <<: *ha-runtime
    build:
      context: .
      dockerfile: ./infra/docker/rust-toolchain.Dockerfile
    image: sag-rust-toolchain:1.94
    working_dir: /workspace
    command: ["/workspace/target/release/sag-auth"]
    volumes:
      - ./:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - target_cache:/workspace/target
    environment:
      <<: *auth-security-environment
      SAG_DOCKER_COMPOSE: "1"
      SAG_AUTH_INSTANCE_ID: edge-auth-2
      SAG_LOGIN_MEMO_TTL_SEC: ${SAG_LOGIN_MEMO_TTL_SEC:-600}
      SAG_LOGIN_MEMO_MAX_CAPACITY: ${SAG_LOGIN_MEMO_MAX_CAPACITY:-500000}
      SAG_PUBLIC_BASE_URL: http://${SAG_PUBLIC_HOST:-192.168.8.87}:8080
      SAG_FOURA_REDIRECT_URI: http://${SAG_PUBLIC_HOST:-192.168.8.87}:3001/api-auth/api/v1/auth/sso/callback
      SAG_FOURA_FIRST_URI: http://fake-4a:19080/oauth/authorize
      SAG_FOURA_SECOND_URI: http://fake-4a:19080/oauth/token
      SAG_FOURA_THIRD_URI: http://fake-4a:19080/oauth/userinfo
      SAG_FOURA_CLIENT_ID: sag-local-client
      SAG_FOURA_DEFAULT_ROLES: user
      SAG_FOURA_ROLE_MAP: boss:boss;alice:tech;bob:ops
      SAG_SSO_PORTAL_REDIRECT_URL: http://${SAG_PUBLIC_HOST:-192.168.8.87}:3001/app
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  sag-auth-lb:
    <<: *ha-runtime
    image: nginx:1.27-alpine
    depends_on:
      sag-auth:
        condition: service_healthy
      sag-auth-2:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/sag-auth-lb.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  sag-policy-2:
    <<: *ha-runtime
    build:
      context: .
      dockerfile: ./infra/docker/rust-toolchain.Dockerfile
    image: sag-rust-toolchain:1.94
    working_dir: /workspace
    command: ["/workspace/target/release/sag-policy"]
    volumes:
      - ./:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - target_cache:/workspace/target
    environment:
      <<: *policy-security-environment
      SAG_DOCKER_COMPOSE: "1"
      SAG_POLICY_INSTANCE_ID: edge-policy-2
      SAG_POLICY_CACHE_TTL_SEC: ${SAG_POLICY_CACHE_TTL_SEC:-30}
      SAG_POLICY_CACHE_MAX_CAPACITY: ${SAG_POLICY_CACHE_MAX_CAPACITY:-200000}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8081; printf \"GET /ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  sag-policy-lb:
    <<: *ha-runtime
    image: nginx:1.27-alpine
    depends_on:
      sag-policy:
        condition: service_healthy
      sag-policy-2:
        condition: service_healthy
    expose:
      - "8081"
    volumes:
      - ./infra/nginx/sag-policy-lb.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  stealth-tunnel-agent:
    environment:
      SAG_AUTH_VERIFY_ENDPOINT: http://sag-auth-lb:8080/api/v1/auth/verify
      SAG_POLICY_EVALUATE_ENDPOINT: http://sag-policy-lb:8081/api/v1/policy/evaluate

  stealth-tunnel-agent-2:
    environment:
      SAG_AUTH_VERIFY_ENDPOINT: http://sag-auth-lb:8080/api/v1/auth/verify
      SAG_POLICY_EVALUATE_ENDPOINT: http://sag-policy-lb:8081/api/v1/policy/evaluate

  frontend-admin-next:
    environment:
      VITE_AUTH_PROXY_TARGET: http://sag-auth-lb:8080
      AUTH_PROXY_TARGET: http://sag-auth-lb:8080

  frontend-portal:
    environment:
      VITE_AUTH_PROXY_TARGET: http://sag-auth-lb:8080
      AUTH_PROXY_TARGET: http://sag-auth-lb:8080

  frontend-admin:
    environment:
      VITE_AUTH_PROXY_TARGET: http://sag-auth-lb:8080
      AUTH_PROXY_TARGET: http://sag-auth-lb:8080
