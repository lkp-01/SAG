<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>老板看板 - SecureTech 集团</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><small>经营驾驶舱</small><h1>老板看板</h1><span class="muted">收入 / 风险 / 交付</span></div>
      <nav class="nav">
        <a class="active" href="#">经营总览</a>
        <a href="#">收入分析</a>
        <a href="#">项目交付</a>
        <a href="#">成本趋势</a>
        <a href="#">风险事项</a>
      </nav>
    </aside>
    <main class="main">
      <div class="topbar"><h2>集团经营驾驶舱</h2><div class="tag">董事会周报已更新</div></div>
      <section class="hero"><h3>营收与交付双线稳定，风险项持续下降</h3><p>老板看板汇总关键经营指标、重大项目状态和组织健康度，适合作为高层视角演示页面。</p></section>
      <section class="stats">
        <div class="card"><div class="stat-value">¥2.38亿</div><div class="label">季度营收</div></div>
        <div class="card"><div class="stat-value">31.6%</div><div class="label">毛利率</div></div>
        <div class="card"><div class="stat-value">18</div><div class="label">重点项目</div></div>
        <div class="card"><div class="stat-value">4</div><div class="label">重大风险事项</div></div>
      </section>
      <section class="grid-2">
        <div class="card table">
          <h3>重点项目</h3>
          <div class="row"><div><strong>零信任接入平台</strong><span class="label">本月进入生产演示阶段</span></div><span class="pill green">正常</span></div>
          <div class="row"><div><strong>审计风控中心</strong><span class="label">客户验收准备中</span></div><span class="pill blue">推进中</span></div>
          <div class="row"><div><strong>终端安全平台</strong><span class="label">资源协调需跟进</span></div><span class="pill orange">关注</span></div>
        </div>
        <div class="card list">
          <h3>经营提醒</h3>
          <div class="item"><span>回款达成率</span><strong>93%</strong></div>
          <div class="item"><span>交付准时率</span><strong>96%</strong></div>
          <div class="item"><span>高优风险关闭率</span><strong>78%</strong></div>
        </div>
      </section>
      <div class="footer-note">该页面为演示用静态管理驾驶舱首页。</div>
    </main>
  </div>
</body>
</html>
