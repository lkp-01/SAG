upstream apisix_data {
    least_conn;
    server apisix:9080 max_fails=2 fail_timeout=5s;
    server apisix-2:9080 max_fails=2 fail_timeout=5s;
    keepalive 256;
}

upstream apisix_control {
    server apisix:9092 max_fails=2 fail_timeout=5s;
    server apisix-2:9092 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 9080;
    location / {
        proxy_pass http://apisix_data;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 9092;
    location / {
        proxy_pass http://apisix_control;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
}
