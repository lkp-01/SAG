# Round-robin / least_conn LB for sag-auth replicas (docker-compose.hscale-auth.yml).
upstream sag_auth_backend {
    least_conn;
    server sag-auth:8080 max_fails=2 fail_timeout=5s;
    server sag-auth-2:8080 max_fails=2 fail_timeout=5s;
    keepalive 512;
}

server {
    listen 8080;
    server_name _;

    location / {
        proxy_pass http://sag_auth_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
